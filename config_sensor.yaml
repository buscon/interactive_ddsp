# SensorDDSP configuration
# Proximity sensor + touch_time + sound_id -> audio

data:
  root: /home/marcello/Documents/interactive_ddsp/bakeoff_data_aligned
  chunk_s: 10.0
  train_sounds: null  # null = all
  val_sounds: null
  train_curves: null  # null = all in train split
  val_curves: null

model:
  n_sounds: 5
  hidden_size: 512
  n_harmonic: 100
  n_bands: 65
  sampling_rate: 48000
  block_size: 480
  sound_emb_dim: 16
  max_f0_octaves: 2.0
  # f0 roots from Sentire SC sources (sound_id order: canopy, forestPad, swarm, percussion, moss)
  f0_base_hz_override: [110.0, 210.0, 100.0, 200.0, 110.0]

train:
  batch: 8
  lr_start: 1.0e-3
  lr_stop: 1.0e-4
  decay_over: 1000  # steps
  scales: [4096, 2048, 1024, 512, 256, 128]
  overlap: 0.75
  steps: 2000
  seed: 0
